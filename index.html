<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title> 🐖 🐖乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
body{background:#1a1a2e;color:#fff;min-height:100vh;overflow:hidden;}
#mainMenu{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:16px;gap:24px;}
#gameContainer{display:none;width:100%;height:100vh;padding:10px;}
.title{font-size:32px;font-weight:bold;color:#4fc3f7;cursor:pointer;text-align:center;}
.menuBtn{width:min(260px,90%);padding:14px;font-size:18px;border:none;border-radius:12px;background:#2979ff;color:#fff;margin:6px;cursor:pointer;}
.menuBtn:active{opacity:0.8;}
.topBar{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;margin-bottom:8px;}
.scoreText{font-size:20px;font-weight:bold;cursor:pointer;}
.backBtn{padding:6px 12px;background:#f44336;border-radius:8px;border:none;color:#fff;font-size:16px;cursor:pointer;}
.boardWrap{display:flex;justify-content:center;flex:1;overflow:hidden;}
#gameBoard{display:grid;gap:3px;}
.cell{
    border-radius:6px;
    cursor:pointer;
    transition:transform 0.15s, box-shadow 0.15s;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}
.cell:active{transform:scale(0.92);}
.cell.selected{
    box-shadow:0 0 0 4px #fff, 0 0 14px 7px rgba(255,255,255,0.85);
    transform:scale(1.08);
}
.toolBar{position:fixed;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:8px;}
.toolBtn{padding:10px 12px;border:none;border-radius:10px;background:#673ab7;color:#fff;font-size:14px;cursor:pointer;min-width:95px;}
.toolBtn:disabled{background:#555;cursor:not-allowed;opacity:0.6;}
.tipToast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);padding:16px 24px;border-radius:10px;font-size:18px;display:none;z-index:999;white-space:nowrap;animation:fade 0.35s ease;}
.toolToast{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);background:rgba(103,58,183,0.9);padding:12px 20px;border-radius:9px;font-size:17px;display:none;z-index:998;animation:fade 0.35s ease;}
@keyframes fade{
    0%{opacity:0;transform:translate(-50%,-50%) scale(0.85);}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1);}
}
.modalMask{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:1000;}
.modalBox{background:#222;padding:24px;border-radius:14px;text-align:center;max-width:320px;width:90%;}
.modalBox p{margin-bottom:16px;font-size:17px;}
.modalBox input{width:100%;padding:10px;font-size:16px;border-radius:6px;border:none;margin-bottom:16px;outline:none;color:#000;}
.modalBox button{margin:0 8px;padding:9px 18px;border:none;border-radius:8px;font-size:16px;cursor:pointer;}
.btnYes{background:#00c853;color:#fff;}
.btnNo{background:#999;color:#fff;}
</style>
</head>
<body>

<!-- 公告弹窗【游戏启动自动弹出】 -->
<div class="modalMask" id="noticeMask">
    <div class="modalBox">
        <p style="font-size:20px;font-weight:bold;">游戏公告</p>
        <p>欢迎游玩 🐖 🐖乐！<br>新版本<p>删除了三消炸弹全屏清除<p>删除了选择地图后是否使用工具选项<p>新增了几个开发者彩蛋。</p>
        <button class="btnYes" id="noticeConfirm">知道了</button>
    </div>
</div>

<!-- 主菜单 -->
<div id="mainMenu">
    <div class="title" id="gameTitle"> 🐖 🐖乐</div>
    <button class="menuBtn" data-size="small">小地图</button>
    <button class="menuBtn" data-size="mid">中地图</button>
    <button class="menuBtn" data-size="big">大地图</button>
</div>

<!-- 游戏界面 -->
<div id="gameContainer">
    <div class="topBar">
        <span class="scoreText">积分：<span id="scoreNum">0</span></span>
        <button class="backBtn" id="returnMenu">返回主菜单</button>
    </div>
    <div class="boardWrap">
        <div id="gameBoard"></div>
    </div>
    <div class="toolBar" id="toolBar" style="display:none;">
        <button class="toolBtn" id="tool1">随机炸弹(6)</button>
        <button class="toolBtn" id="tool2">清除一列(3)</button>
        <button class="toolBtn" id="tool3">清空全部(1)</button>
    </div>
</div>

<!-- 全局自定义弹窗（复用） -->
<div class="modalMask" id="modalMask">
    <div class="modalBox">
        <p id="modalText">提示文字</p>
        <input type="text" id="modalInput" style="display:none;" placeholder="请输入内容">
        <button class="btnYes" id="modalYes">确定</button>
        <button class="btnNo" id="modalNo">取消</button>
    </div>
</div>

<!-- 通用提示弹窗 -->
<div class="tipToast" id="toast"></div>
<!-- 道具使用提示 -->
<div class="toolToast" id="toolToast"></div>

<script>
// ========== 全局配置 ==========
const BLOCK_COLORS = [
    '#e53935', //红
    '#1e88e5', //蓝
    '#fdd835', //黄
    '#43a047', //绿
    '#00acc1'  //青
];
const BOMB_COLOR = '#757575'; //灰色炸弹
const BLOCK_EMOJI = '🐖';
const BOMB_TYPE = 5;
const BASE_BOMB_RATE = 0.08; //基础炸弹概率

let sizeConfig = {
    small: {row:6,col:6},
    mid: {row:8,col:8},
    big: {row:10,col:10}
};
let ROW = 8, COL = 8;
let board = [];
let selected = null;
let score = 0;
let useTools = true;

//开发者开关（重点改动：返回主菜单不再重置dev2）
let dev1 = false; //666 道具无限
let dev2 = false; //325 炸弹概率×2，切换游戏房间持续生效，再次输入325关闭
let dev3 = false; //114 自定义积分

let toolCount = {t1:6,t2:3,t3:1};
let titleClickTimes = 0;
let titleClickTimer = null;
let toolToastShowing = false;

//DOM
const mainMenu = document.getElementById('mainMenu');
const gameContainer = document.getElementById('gameContainer');
const gameBoard = document.getElementById('gameBoard');
const scoreNum = document.getElementById('scoreNum');
const scoreText = document.querySelector('.scoreText');
const returnMenuBtn = document.getElementById('returnMenu');
const gameTitle = document.getElementById('gameTitle');
const modalMask = document.getElementById('modalMask');
const modalText = document.getElementById('modalText');
const modalInput = document.getElementById('modalInput');
const modalYes = document.getElementById('modalYes');
const modalNo = document.getElementById('modalNo');
const toolBar = document.getElementById('toolBar');
const tool1 = document.getElementById('tool1');
const tool2 = document.getElementById('tool2');
const tool3 = document.getElementById('tool3');
const toast = document.getElementById('toast');
const toolToast = document.getElementById('toolToast');
//公告
const noticeMask = document.getElementById('noticeMask');
const noticeConfirm = document.getElementById('noticeConfirm');

//启动弹出公告
noticeConfirm.onclick = ()=>{
    noticeMask.style.display = 'none';
}
noticeMask.style.display = 'flex';

//返回主菜单
returnMenuBtn.onclick = backToMenu;
function backToMenu(){
    mainMenu.style.display = 'flex';
    gameContainer.style.display = 'none';
    toolBar.style.display = 'none';
    resetDevMode();
    resetToolCount();
}
function resetDevMode(){
    dev1 = false;
    //dev2 保留！不会重置，永久生效直到再次输入325切换
    dev3 = false;
}
function resetToolCount(){
    toolCount = {t1:6,t2:3,t3:1};
    updateToolText();
}

//标题点击监听
gameTitle.addEventListener('click',()=>{
    titleClickTimes++;
    clearTimeout(titleClickTimer);
    titleClickTimer = setTimeout(()=>{
        titleClickTimes = 0;
    },5000);
    if(titleClickTimes >= 10){
        showDevInputModal();
        titleClickTimes = 0;
    }
});

//打开开发者激活码弹窗
function showDevInputModal(){
    modalMask.style.display = 'flex';
    modalText.textContent = "请输入开发者激活码";
    modalInput.style.display = 'block';
    modalInput.value = "";
    modalInput.focus();
    modalYes.onclick = checkDevCode;
    modalNo.onclick = closeModal;
}

//校验激活码
function checkDevCode(){
    let code = modalInput.value.trim();
    closeModal();
    if(code === "666"){
        dev1 = true;
        showToast("开发者1已激活：道具无限使用");
    }else if(code === "325"){
        //切换开关：再次输入则关闭增益
        dev2 = !dev2;
        if(dev2){
            showToast("开发者2已激活：炸弹生成概率×2");
        }else{
            showToast("开发者2已关闭：恢复原始炸弹概率");
        }
    }else if(code === "114"){
        dev3 = true;
        showToast("开发者3已激活：点击积分自定义数值");
    }else{
        //错误激活码提示
        showToast("激活码不正确");
    }
    updateToolText();
}

//关闭弹窗
function closeModal(){
    modalMask.style.display = 'none';
    modalInput.style.display = 'none';
}

//【自定义弹窗封装】替代原生confirm
function openConfirmModal(text, onOk){
    modalMask.style.display = 'flex';
    modalText.textContent = text;
    modalInput.style.display = 'none';
    modalYes.onclick = ()=>{
        closeModal();
        onOk();
    };
    modalNo.onclick = closeModal;
}

//【自定义弹窗封装】替代原生prompt
function openPromptModal(text, defaultVal, callback){
    modalMask.style.display = 'flex';
    modalText.textContent = text;
    modalInput.style.display = 'block';
    modalInput.value = defaultVal;
    modalInput.focus();
    modalYes.onclick = ()=>{
        let val = modalInput.value.trim();
        closeModal();
        callback(val);
    };
    modalNo.onclick = ()=>{
        closeModal();
        callback(null);
    };
}

//点击积分文字（dev3生效）
scoreText.onclick = function(){
    if(!dev3) return;
    openPromptModal("输入自定义积分：", String(score), (val)=>{
        if(val === null) return;
        let num = parseInt(val);
        if(!isNaN(num)){
            score = num;
            scoreNum.textContent = score;
        }
    });
}

//选择棋盘大小按钮
document.querySelectorAll('.menuBtn').forEach(btn=>{
    btn.onclick = ()=>{
        const s = btn.dataset.size;
        ROW = sizeConfig[s].row;
        COL = sizeConfig[s].col;
        startGame();
    }
});

//初始化游戏
function startGame(){
    score = 0;
    scoreNum.textContent = score;
    resetToolCount();
    mainMenu.style.display = 'none';
    gameContainer.style.display = 'block';
    toolBar.style.display = 'flex';
    updateToolText();
    initBoard();
    renderBoard();
}

//生成方块【dev2永久持续，切换房间不消失，再次输入325开关】
function randomBlock(){
    let rate = BASE_BOMB_RATE;
    if(dev2){
        rate *= 2;
    }
    //限制最大概率不超过0.9防止全是炸弹
    if(rate > 0.9) rate = 0.9;
    let r = Math.random();
    if(r < rate) return BOMB_TYPE;
    return Math.floor(Math.random()*5);
}

//初始化棋盘
function initBoard(){
    board = [];
    for(let y=0;y<ROW;y++){
        let line = [];
        for(let x=0;x<COL;x++){
            line.push(randomBlock());
        }
        board.push(line);
    }
    //清除初始自带三消
    while(findMatch().matched.size>0){
        initBoard();
    }
}

//渲染棋盘
function renderBoard(){
    gameBoard.innerHTML = '';
    const maxWidth = Math.min(window.innerWidth-20, 420);
    const cellSize = Math.floor(maxWidth / COL);
    gameBoard.style.gridTemplateColumns = `repeat(${COL}, ${cellSize}px)`;

    for(let y=0;y<ROW;y++){
        for(let x=0;x<COL;x++){
            const val = board[y][x];
            const div = document.createElement('div');
            div.classList.add('cell');
            div.style.width = cellSize+'px';
            div.style.height = cellSize+'px';

            if(val === BOMB_TYPE){
                div.style.background = BOMB_COLOR;
                div.textContent = '💣';
            }else{
                div.style.background = BLOCK_COLORS[val];
                div.textContent = BLOCK_EMOJI;
            }

            div.dataset.x = x;
            div.dataset.y = y;
            div.onclick = ()=>cellClick(x,y);
            gameBoard.appendChild(div);
        }
    }
}

//格子点击逻辑
function cellClick(x,y){
    //点击炸弹直接引爆
    if(board[y][x] === BOMB_TYPE){
        clearSelection();
        triggerBomb(x,y,true);
        return;
    }

    if(selected === null){
        selected = {x,y};
        renderBoard();
        highlightCell(x,y,true);
    }else{
        const sx = selected.x, sy = selected.y;

        if(sx === x && sy === y){
            selected = null;
            renderBoard();
            return;
        }

        const isNear = (Math.abs(sx-x)===1 && sy===y) || (Math.abs(sy-y)===1 && sx===x);

        if(isNear){
            swapBlock(sx,sy,x,y);
            selected = null;
            setTimeout(()=>checkAllMatch(true),120);
        }else{
            selected = {x,y};
            renderBoard();
            highlightCell(x,y,true);
        }
    }
}

//高亮指定方块
function highlightCell(x,y,enable){
    const cells = document.querySelectorAll('.cell');
    cells.forEach(cell=>{
        if(cell.dataset.x == x && cell.dataset.y == y){
            if(enable){
                cell.classList.add('selected');
            }else{
                cell.classList.remove('selected');
            }
        }
    });
}

//清除选中状态
function clearSelection(){
    selected = null;
    const cells = document.querySelectorAll('.cell');
    cells.forEach(cell=>cell.classList.remove('selected'));
}

//炸弹引爆（连锁爆炸）
async function triggerBomb(bx,by,enableScore,explodeQueue = new Set()){
    const key = `${bx},${by}`;
    if(explodeQueue.has(key)) return;
    explodeQueue.add(key);

    let removeSet = new Set();
    let nextBombs = [];
    //3x3范围遍历
    for(let dy=-1;dy<=1;dy++){
        for(let dx=-1;dx<=1;dx++){
            let nx = bx+dx;
            let ny = by+dy;
            if(nx>=0&&nx<COL&&ny>=0&&ny<ROW){
                const cellVal = board[ny][nx];
                if(cellVal === BOMB_TYPE){
                    nextBombs.push({x:nx,y:ny});
                }else{
                    removeSet.add(`${nx},${ny}`);
                }
            }
        }
    }

    if(enableScore){
        score += removeSet.size * 10;
        scoreNum.textContent = score;
    }

    removeSet.forEach(pos=>{
        let [x,y] = pos.split(',').map(Number);
        board[y][x] = null;
    });
    board[by][bx] = null;

    renderBoard();
    await sleep(220);
    dropBlocks();
    fillEmpty();
    renderBoard();
    await sleep(180);

    for(let bomb of nextBombs){
        await triggerBomb(bomb.x,bomb.y,enableScore,explodeQueue);
    }
    checkAllMatch(true);
}

//交换方块
function swapBlock(x1,y1,x2,y2){
    let t = board[y1][x1];
    board[y1][x1] = board[y2][x2];
    board[y2][x2] = t;
    renderBoard();
}

//查找匹配
function findMatch(){
    let matched = new Set();
    //横向查找
    for(let y=0;y<ROW;y++){
        for(let x=0;x<COL-2;x++){
            let v = board[y][x];
            if(v===null) continue;
            if(board[y][x+1] === v && board[y][x+2] === v){
                matched.add(`${x},${y}`);
                matched.add(`${x+1},${y}`);
                matched.add(`${x+2},${y}`);
                let k = x+3;
                while(k<COL && board[y][k]===v){
                    matched.add(`${k},${y}`);k++;
                }
            }
        }
    }
    //纵向查找
    for(let x=0;x<COL;x++){
        for(let y=0;y<ROW-2;y++){
            let v = board[y][x];
            if(v===null) continue;
            if(board[y+1][x] === v && board[y+2][x] === v){
                matched.add(`${x},${y}`);
                matched.add(`${x},${y+1}`);
                matched.add(`${x},${y+2}`);
                let k = y+3;
                while(k<ROW && board[k][x]===v){
                    matched.add(`${x},${k}`);k++;
                }
            }
        }
    }
    return {matched};
}

//检测消除
async function checkAllMatch(enableScore){
    const {matched} = findMatch();
    let matchList = [];
    matched.forEach(s=>{
        let [x,y] = s.split(',').map(Number);
        matchList.push({x,y});
    });
    if(matchList.length === 0) return;

    let normalRemove = new Set();
    for(let p of matchList){
        normalRemove.add(`${p.x},${p.y}`);
    }

    if(enableScore){
        score += normalRemove.size * 10;
        scoreNum.textContent = score;
    }

    normalRemove.forEach(pos=>{
        let [x,y] = pos.split(',').map(Number);
        board[y][x] = null;
    });

    renderBoard();
    await sleep(220);
    dropBlocks();
    fillEmpty();
    renderBoard();
    await sleep(180);
    checkAllMatch(enableScore);
}

//方块下落
function dropBlocks(){
    for(let x=0;x<COL;x++){
        for(let y=ROW-1;y>=0;y--){
            if(board[y][x] === null){
                for(let up=y-1;up>=0;up--){
                    if(board[up][x] !== null){
                        board[y][x] = board[up][x];
                        board[up][x] = null;
                        break;
                    }
                }
            }
        }
    }
}

//空白填充新方块
function fillEmpty(){
    for(let x=0;x<COL;x++){
        for(let y=0;y<ROW;y++){
            if(board[y][x] === null){
                board[y][x] = randomBlock();
            }
        }
    }
}

function sleep(ms){
    return new Promise(res=>setTimeout(res,ms));
}

//通用提示文字
function showToast(text){
    toast.textContent = text;
    toast.style.display = 'block';
    setTimeout(()=>toast.style.display='none',3000);
}

//道具专用提示
function showToolTip(text){
    if(toolToastShowing) return;
    toolToastShowing = true;
    toolToast.textContent = text;
    toolToast.style.display = 'block';
    setTimeout(()=>{
        toolToast.style.display='none';
        toolToastShowing = false;
    },1600);
}

//更新道具按钮文字与状态
function updateToolText(){
    if(dev1){
        tool1.textContent = "随机炸弹(无限)";
        tool2.textContent = "清除一列(无限)";
        tool3.textContent = "清空全部(无限)";
        tool1.disabled = false;
        tool2.disabled = false;
        tool3.disabled = false;
        return;
    }
    tool1.textContent = `随机炸弹(${toolCount.t1})`;
    tool2.textContent = `清除一列(${toolCount.t2})`;
    tool3.textContent = `清空全部(${toolCount.t3})`;
    tool1.disabled = toolCount.t1 <=0;
    tool2.disabled = toolCount.t2 <=0;
    tool3.disabled = toolCount.t3 <=0;
}

//道具1：随机生成炸弹
tool1.onclick = function(){
    if(!dev1 && toolCount.t1 <= 0) return;

    let availablePos = [];
    for(let y=0;y<ROW;y++){
        for(let x=0;x<COL;x++){
            if(board[y][x] !== BOMB_TYPE){
                availablePos.push({x,y});
            }
        }
    }
    if(availablePos.length === 0){
        showToolTip("无法放置，棋盘已满炸弹！");
        return;
    }
    showToolTip("道具生效：随机生成炸弹方块");
    let ran = availablePos[Math.floor(Math.random()*availablePos.length)];
    board[ran.y][ran.x] = BOMB_TYPE;
    if(!dev1) toolCount.t1--;
    updateToolText();
    renderBoard();
}

//道具2：随机清除一列
tool2.onclick = function(){
    if(!dev1 && toolCount.t2 <=0) return;
    showToolTip("道具生效：清除随机整列方块");
    let randCol = Math.floor(Math.random()*COL);
    for(let y=0;y<ROW;y++){
        board[y][randCol] = null;
    }
    if(!dev1) toolCount.t2--;
    updateToolText();
    dropBlocks();fillEmpty();
    renderBoard();
    setTimeout(()=>checkAllMatch(true),120);
}

//道具3：清空全部方块
tool3.onclick = function(){
    if(!dev1 && toolCount.t3 <=0) return;
    showToolTip("道具生效：清空全部方块");
    for(let y=0;y<ROW;y++){
        for(let x=0;x<COL;x++){
            board[y][x] = null;
        }
    }
    if(!dev1) toolCount.t3--;
    updateToolText();
    fillEmpty();
    renderBoard();
    setTimeout(()=>checkAllMatch(true),120);
}

//窗口大小变化刷新渲染
window.addEventListener('resize',()=>{
    if(gameContainer.style.display === 'block') renderBoard();
})
</script>
</body>
</html>
