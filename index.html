          var newHead = newDoc.head;
          var newBody = newDoc.body;
          
          // 清空当前文档
          while (document.head.firstChild) {
            document.head.removeChild(document.head.firstChild);
          }
          while (document.body.firstChild) {
            document.body.removeChild(document.body.firstChild);
          }
          
          // 复制head内容
          if (newHead) {
            Array.from(newHead.childNodes).forEach(function(node) {
              document.head.appendChild(node.cloneNode(true));
            });
          }
          
          // 复制body内容
          if (newBody) {
            Array.from(newBody.childNodes).forEach(function(node) {
              document.body.appendChild(node.cloneNode(true));
            });
            
            // 复制body的属性
            Array.from(newBody.attributes).forEach(function(attr) {
              document.body.setAttribute(attr.name, attr.value);
            });
          }
          
          // 重新执行所有script标签
          var scripts = document.querySelectorAll('script');
          scripts.forEach(function(oldScript) {
            var newScript = document.createElement('script');
            
            // 复制所有属性
            Array.from(oldScript.attributes).forEach(function(attr) {
              newScript.setAttribute(attr.name, attr.value);
            });
            
            // 复制脚本内容
            if (oldScript.textContent) {
              newScript.textContent = oldScript.textContent;
            }
            
            // 替换旧脚本
            oldScript.parentNode.replaceChild(newScript, oldScript);
          });
          
          // 触发DOMContentLoaded事件，确保所有脚本正确执行
          var event = document.createEvent('Event');
          event.initEvent('DOMContentLoaded', true, true);
          window.document.dispatchEvent(event);
          
        }, 100);
        
      } catch(e) {
        console.error('解密失败:', e);
        document.body.innerHTML = '<div style="padding: 40px; text-align: center; font-family: Arial, sans-serif;"><div style="color: #e74c3c; font-size: 24px; margin-bottom: 10px;">⚠️ 解密失败</div><div style="color: #666; font-size: 16px;">页面内容无法正确显示，请检查加密代码是否正确</div></div>';
      }
    })();
  </script>
</body>
</html>
